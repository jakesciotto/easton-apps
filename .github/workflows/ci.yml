name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: version is semver
        run: |
          node -e "const v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v)){console.error('version is not MAJOR.MINOR.PATCH, got '+v);process.exit(1)}console.log('version '+v)"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
